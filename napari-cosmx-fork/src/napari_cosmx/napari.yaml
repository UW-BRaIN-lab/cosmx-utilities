name: napari-cosmx-fork
display_name: napari CosMx Fork
contributions:
  commands:
    - id: napari-cosmx-fork.get_reader
      python_name: napari_cosmx._reader:napari_get_reader
      title: Open data with napari CosMx Fork
    - id: napari-cosmx-fork.stitch_widget
      python_name: napari_cosmx._dock_widget:make_stitching_widget
      title: Stitch Images
  widgets:
    - command: napari-cosmx-fork.stitch_widget
      display_name: Stitch Images
  readers:
    - command: napari-cosmx-fork.get_reader
      filename_patterns: ['*']
      accepts_directories: true