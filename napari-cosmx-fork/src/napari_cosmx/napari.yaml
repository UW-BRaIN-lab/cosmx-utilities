name: napari-CosMx
display_name: napari CosMx
contributions:
  commands:
    - id: napari-CosMx.get_reader
      python_name: napari_cosmx._reader:napari_get_reader
      title: Open data with napari CosMx
    - id: napari-CosMx.stitch_widget
      python_name: napari_cosmx._dock_widget:make_stitching_widget
      title: Stitch Images
  widgets:
    - command: napari-CosMx.stitch_widget
      display_name: Stitch Images
  readers:
    - command: napari-CosMx.get_reader
      filename_patterns: ['*']
      accepts_directories: true